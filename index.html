<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhotoGallery | Stunning Moments</title>
  <meta name="description" content="A stunning photo gallery showcasing beautiful moments captured in time."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <div class="logo">📷 PhotoGallery</div>
    <nav>
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="city">City</button>
      <button class="filter-btn" data-filter="abstract">Abstract</button>
      <button class="filter-btn" data-filter="people">People</button>
    </nav>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="🔍 Search photos…"/>
    </div>
  </header>

  <!-- ── HERO ── -->
  <section class="hero">
    <h1>Capture the <span class="gradient-text">World</span></h1>
    <p>Explore a curated collection of breathtaking photographs</p>
  </section>

  <!-- ── STATS ── -->
  <section class="stats">
    <div class="stat"><span id="totalCount">0</span><small>Photos</small></div>
    <div class="stat"><span id="likedCount">0</span><small>Liked</small></div>
    <div class="stat"><span>4</span><small>Categories</small></div>
  </section>

  <!-- ── GALLERY GRID ── -->
  <main class="gallery" id="gallery"></main>

  <!-- ── LIGHTBOX ── -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
    <div class="lb-content">
      <img id="lbImg" src="" alt=""/>
      <div class="lb-info">
        <h2 id="lbTitle"></h2>
        <p id="lbDesc"></p>
        <span class="lb-tag" id="lbTag"></span>
      </div>
    </div>
    <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
  </div>

  <!-- ── FOOTER ── -->
  <footer>
    <p>Made with ❤️ · PhotoGallery &copy; 2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
